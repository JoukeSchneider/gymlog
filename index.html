<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gymlog</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gymlog">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF0F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13171C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F2;--surface:#FFFFFF;--ink:#18202A;--muted:#5E6873;--line:#D5DBE0;--soft:#E4E9ED;
  --accent:#1F5AA6;--accent-ink:#FFFFFF;--ok:#2E8B4E;--danger:#C8312B;--warn:#FFF4D1;--warn-ink:#6B4E00;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#13171C;--surface:#1C2229;--ink:#E7EBEE;--muted:#98A2AC;--line:#2C353E;--soft:#252D35;
    --accent:#6A9BE0;--accent-ink:#0E1620;--ok:#5DBB7E;--danger:#E8665F;--warn:#3A3220;--warn-ink:#F2D58A;color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
header.top{max-width:640px;margin:0 auto;padding:18px 16px 4px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font:700 2.3rem/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:0}
.today{color:var(--muted);font-size:.95rem}
main{max-width:640px;margin:0 auto;padding:8px 16px 120px}
h2{font:700 1.6rem/1.1 "Barlow Condensed","Arial Narrow",sans-serif;margin:26px 0 10px}
h3{font:600 1.2rem/1.2 "Barlow Condensed","Arial Narrow",sans-serif;margin:0}
p{margin:6px 0}
.muted{color:var(--muted)} .small{font-size:.9rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;max-width:160px;border:0;border-top:3px solid transparent;background:none;color:var(--muted);font:600 1.05rem "Barlow Condensed","Arial Narrow",sans-serif;padding:11px 4px 13px;cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:500 .95rem "Barlow",sans-serif;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ex{background:var(--surface);border:1px solid var(--line);border-left:7px solid var(--plate,var(--muted));border-radius:6px;padding:14px 14px 12px;margin:12px 0}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-name{font:600 1.3rem/1.15 "Barlow Condensed","Arial Narrow",sans-serif}
.group{font-size:.82rem;color:var(--muted)}
.done-tag{font-size:.82rem;font-weight:600;color:var(--ok);white-space:nowrap}
.last{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:6px}
.big{font:700 3rem/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
.big .u{font-size:1.15rem;color:var(--muted);margin-left:3px}
.big.none{font-size:1.4rem;color:var(--muted);font-weight:600}
.sr{font:600 1.35rem/1 "Barlow Condensed","Arial Narrow",sans-serif}
.note{margin-top:8px;padding:6px 9px;background:var(--soft);border-radius:4px;font-size:.95rem}
.log{display:flex;gap:8px;margin-top:12px;align-items:flex-end}
.log .w{flex:1;min-width:0}
.log .n{width:62px;flex:none}
.log2{display:flex;gap:8px;margin-top:8px}
.log2 input{flex:1}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted)}
input,select{font:500 1.05rem "Barlow",system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums}
input,select{min-height:44px;line-height:1.2}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.6}
label.f.full{grid-column:1/-1}
details summary{cursor:pointer;color:var(--accent)}
input[type=time]{-webkit-appearance:none;appearance:none;display:block;text-align:left}
input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0}
.wdate{display:flex;gap:10px;align-items:flex-end;margin:4px 0 8px}
.wdate label.f{max-width:220px;flex:1}
.past{background:var(--warn);color:var(--warn-ink);border-radius:6px;padding:8px 12px;margin:0 0 8px;font-size:.93rem}
label.f.full input[type=date]{max-width:220px}
.stepper{display:flex}
.stepper input{text-align:center;border-radius:0;border-left:0;border-right:0}
.stepper button{flex:none;width:40px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 1.2rem "Barlow",sans-serif;cursor:pointer}
.stepper button:first-child{border-radius:4px 0 0 4px}
.stepper button:last-child{border-radius:0 4px 4px 0}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:9px 16px;font:600 1rem "Barlow",sans-serif;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.sm{padding:5px 10px;font-size:.9rem}
.link{background:none;border:0;padding:0;color:var(--accent);font:500 .92rem "Barlow",sans-serif;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hist{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.hrow{display:grid;grid-template-columns:62px 1fr auto;gap:8px;padding:5px 0;font-size:.93rem;align-items:start}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:0 4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;margin:12px 0}
.banner{background:var(--warn);color:var(--warn-ink);border-radius:6px;padding:10px 12px;margin:8px 0;font-size:.93rem;display:flex;justify-content:space-between;gap:10px;align-items:center}
.banner .link{color:inherit}
.empty{text-align:center;padding:36px 12px}
.empty h3{font-size:1.5rem;margin-bottom:6px}
.rlist{list-style:none;margin:10px 0 0;padding:0}
.rlist li{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.rlist li .nm{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--plate)}
.ib{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;width:32px;height:32px;cursor:pointer;font-size:.95rem}
.ib[disabled]{opacity:.35}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{columns:2;column-gap:16px;font-size:.93rem;margin-top:8px}
.cat div{break-inside:avoid;display:flex;gap:7px;align-items:center;padding:2px 0}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin:8px 0 4px}
.stat .v{font:700 2.2rem/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
.stat .l{font-size:.85rem;color:var(--muted)}
.delta.down{color:var(--ok)} .delta.up{color:var(--danger)}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.tablewrap{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
td.del{position:sticky;left:0;background:var(--bg);padding-left:0;width:1%}
th{font-weight:600;color:var(--muted)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:4px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <h1>Gymlog</h1>
  <span class="today" id="todayLbl"></span>
</header>
<main id="main"></main>
<nav class="tabs" aria-label="Onderdelen">
  <button data-act="tab:workout">Workout</button>
  <button data-act="tab:schemas">Schema’s</button>
  <button data-act="tab:metingen">Metingen</button>
  <button data-act="tab:backup">Instellingen</button>
</nav>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="photoFile" accept="image/*" hidden>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
const KEY='gymlog-v1';
const GROUPS={Borst:'#2E8B4E',Rug:'#1F5AA6',Benen:'#C8312B',Schouders:'#E0A800',Armen:'#7A4FA0',Core:'#6B7682',Cardio:'#D9741E'};
const DEFAULT_EX=[
  ['bench-press','Bankdrukken','Borst'],['incline-db-press','Schuin drukken met dumbbells','Borst'],['chest-press','Chest press (machine)','Borst'],['pec-fly','Pec fly','Borst'],
  ['lat-pulldown','Lat pulldown','Rug'],['seated-row','Seated row','Rug'],['deadlift','Deadlift','Rug'],['back-extension','Back extension','Rug'],
  ['squat','Squat','Benen'],['leg-press','Leg press','Benen'],['leg-extension','Leg extension','Benen'],['leg-curl','Leg curl','Benen'],['lunges','Lunges','Benen'],['calf-raise','Calf raise','Benen'],
  ['shoulder-press','Shoulder press','Schouders'],['lateral-raise','Lateral raise','Schouders'],
  ['biceps-curl','Biceps curl','Armen'],['triceps-pushdown','Triceps pushdown','Armen'],
  ['plank','Plank','Core'],['crunch-machine','Crunch (machine)','Core'],['crunch-bench','Crunch (bank)','Core'],
  ['treadmill','Loopband','Cardio'],['rowing','Roeitrainer','Cardio'],['crosstrainer','Crosstrainer','Cardio'],
  ['bent-over-row','Bend over row (halter)','Rug'],['arm-curl-db','Arm curl (halter)','Armen']
].map(([id,name,group])=>({id,name,group}));
const METRICS=[
  {k:'weight',l:'Gewicht',u:'kg',lowerBetter:true},
  {k:'fat',l:'Vetpercentage',u:'%',lowerBetter:true},
  {k:'fatMass',l:'Vetmassa',u:'kg',lowerBetter:true},
  {k:'ffm',l:'Vetvrije massa',u:'kg',lowerBetter:false},
  {k:'muscle',l:'Spiermassa',u:'kg',lowerBetter:false},
  {k:'waterPct',l:'Lichaamsvocht',u:'%',lowerBetter:false},
  {k:'bone',l:'Botmassa',u:'kg',lowerBetter:false},
  {k:'visceral',l:'Visceraal vet',u:'',lowerBetter:true},
  {k:'metaAge',l:'Metabole leeftijd',u:'jr',lowerBetter:true},
  {k:'bmr',l:'BMR',u:'kcal',lowerBetter:false},
  {k:'waist',l:'Buikomtrek',u:'cm',lowerBetter:true},
  {k:'bmi',l:'BMI',u:'',lowerBetter:true,computed:true}
];
const TABS=['workout','schemas','metingen','backup'];

function pad(n){return String(n).padStart(2,'0')}
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fmtDate(iso){if(!iso)return '';return new Date(iso.slice(0,10)+'T12:00:00').toLocaleDateString('nl-NL',{day:'numeric',month:'short'})}
function fmtN(v,dec){if(v==null||v==='')return '–';return Number(v).toLocaleString('nl-NL',{maximumFractionDigits:dec==null?1:dec})}
function num(v){if(v==null)return null;const s=String(v).replace(',','.').trim();if(s==='')return null;const n=Number(s);return isFinite(n)?n:null}
function int(v){const n=num(v);return n==null?null:Math.round(n)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function daysSince(iso){if(!iso)return Infinity;return Math.floor((Date.now()-new Date(iso).getTime())/864e5)}

/* ---------- opslag op het toestel ---------- */
function fresh(){return {v:1,exercises:DEFAULT_EX.slice(),routines:[],entries:[],meas:[],height:null,lastBackup:null,stravaSent:{}}}
function load(){try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);return Object.assign(fresh(),d)}}catch(e){}return fresh()}
let D=load();
let storageOk=true;
// Nieuwe standaardoefeningen toevoegen aan een bestaande lijst (zonder iets te overschrijven)
(function addMissingDefaults(){
  let added=false;
  DEFAULT_EX.forEach(e=>{if(!D.exercises.some(x=>x.id===e.id||x.name.toLowerCase()===e.name.toLowerCase())){D.exercises.push(Object.assign({},e));added=true}});
  if(added)try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}
})();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(D));storageOk=true}
  catch(e){storageOk=false;toast('Opslaan op dit toestel lukt niet. Is de opslag vol of staat privémodus aan?')}
}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}

const S={tab:TABS.includes(location.hash.slice(1))?location.hash.slice(1):'workout',wDate:today(),routineId:null,drafts:{},hist:{},
  mDraft:{date:today()},metric:'weight',newEx:{name:'',group:'Borst'},confirmDel:null,pendingImport:null,confirmWipe:false,stDraft:{},stBusy:false,stNote:'',stCode:null};

const $=s=>document.querySelector(s);
document.getElementById('todayLbl').textContent=new Date().toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});
let toastT;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2600)}

function exById(id){return D.exercises.find(e=>e.id===id)}
function plate(ex){return GROUPS[ex&&ex.group]||'#6B7682'}
function byNewest(a,b){return a.date===b.date?b.ts-a.ts:(a.date<b.date?1:-1)}
function entriesFor(exId){return D.entries.filter(e=>e.exerciseId===exId).sort(byNewest)}
function dayEntry(exId,date){return entriesFor(exId).find(e=>e.date===date)||null}
function prevFor(exId,date){return entriesFor(exId).find(e=>e.date<date)||null}
function dayLabel(date){if(date===today())return 'vandaag';return new Date(date+'T12:00:00').toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'})}

/* ---------- render ---------- */
function render(){
  const a=document.activeElement;const fid=a&&a.id?a.id:null;let ss=null,se=null;
  try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}
  $('#main').innerHTML=view();
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    if(b.dataset.act==='tab:'+S.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});try{if(ss!=null)el.setSelectionRange(ss,se)}catch(e){}}}
}
function view(){
  if(S.tab==='schemas')return vSchemas();
  if(S.tab==='metingen')return vMeas();
  if(S.tab==='backup')return vBackup();
  return vToday();
}
function empty(t,p,btn,act){return '<div class="empty"><h3>'+esc(t)+'</h3><p class="muted">'+esc(p)+'</p>'+(btn?'<p style="margin-top:14px"><button class="btn" data-act="'+act+'">'+esc(btn)+'</button></p>':'')+'</div>'}
function backupBanner(){
  const n=D.entries.length+D.meas.length;if(!n)return '';
  const d=daysSince(D.lastBackup);if(d<14)return '';
  return '<div class="banner"><span>'+(D.lastBackup?'Je laatste back-up is van '+d+' dagen geleden.':'Je hebt nog geen back-up gemaakt.')+'</span><button class="link" data-act="tab:backup">Back-up maken</button></div>';
}

/* ---------- Vandaag ---------- */
function vToday(){
  const rs=D.routines;
  let h=backupBanner();
  if(!rs.length)return h+empty('Nog geen schema','Maak een schema met de oefeningen die je doet. Daarna staat hier bij elk bezoek je vorige gewicht klaar.','Schema maken','tab:schemas');
  const isToday=S.wDate===today();
  h+='<div class="wdate"><label class="f">Datum workout<input type="date" id="w-date" data-wdate="1" max="'+today()+'" value="'+esc(S.wDate)+'"></label>'+(isToday?'':'<button class="btn ghost sm" data-act="wToday">Naar vandaag</button>')+'</div>';
  if(!isToday)h+='<p class="past">Je bewerkt de workout van '+esc(dayLabel(S.wDate))+'.</p>';
  const r=rs.find(x=>x.id===S.routineId)||rs[0];S.routineId=r.id;
  h+='<div class="chips" role="group" aria-label="Schema">'+rs.map(x=>'<button class="chip" aria-pressed="'+(x.id===r.id)+'" data-act="routine:'+esc(x.id)+'">'+esc(x.name)+'</button>').join('')+'</div>';
  if(!r.exercises.length)return h+empty('Dit schema is leeg','Voeg oefeningen toe bij Schema’s.','Oefeningen toevoegen','tab:schemas');
  const doneN=r.exercises.filter(id=>dayEntry(id,S.wDate)).length;
  h+='<p class="muted small">'+doneN+' van '+r.exercises.length+' gedaan '+(isToday?'vandaag':'op deze dag')+'</p>';
  return h+r.exercises.map(card).join('')+stravaPanel();
}
function draftFor(exId){
  if(S.drafts[exId])return S.drafts[exId];
  const l=dayEntry(exId,S.wDate)||prevFor(exId,S.wDate);
  return {weight:l&&l.weight!=null?String(l.weight).replace('.',','):'',sets:l&&l.sets!=null?l.sets:3,reps:l&&l.reps!=null?l.reps:10,note:l&&l.note||''};
}
function card(exId){
  const ex=exById(exId);if(!ex)return '';
  const de=dayEntry(exId,S.wDate);const l=prevFor(exId,S.wDate);const d=draftFor(exId);const id=esc(exId);
  let h='<section class="ex" style="--plate:'+plate(ex)+'">';
  h+='<div class="ex-head"><div><div class="ex-name">'+esc(ex.name)+'</div><div class="group">'+esc(ex.group||'')+'</div></div>'+(de?'<span class="done-tag">✓ Gedaan</span>':'')+'</div>';
  if(l){
    h+='<div class="last"><span class="big">'+fmtN(l.weight)+'<span class="u">kg</span></span>'+(l.sets||l.reps?'<span class="sr">'+(l.sets||'?')+' × '+(l.reps||'?')+'</span>':'')+'<span class="muted small">vorige keer, '+fmtDate(l.date)+'</span></div>';
    if(l.note)h+='<div class="note">'+esc(l.note)+'</div>';
  }else h+='<div class="last"><span class="big none">Geen eerdere keer</span></div>';
  h+='<div class="log">'
    +'<label class="f w">Gewicht (kg)<div class="stepper"><button type="button" aria-label="2,5 kg minder" data-act="step:'+id+':-2.5">−</button><input id="w-'+id+'" inputmode="decimal" data-draft="'+id+'|weight" value="'+esc(d.weight)+'"><button type="button" aria-label="2,5 kg meer" data-act="step:'+id+':2.5">+</button></div></label>'
    +'<label class="f n">Sets<input id="s-'+id+'" inputmode="numeric" data-draft="'+id+'|sets" value="'+esc(d.sets)+'"></label>'
    +'<label class="f n">Reps<input id="r-'+id+'" inputmode="numeric" data-draft="'+id+'|reps" value="'+esc(d.reps)+'"></label>'
    +'</div>';
  h+='<div class="log2"><input id="n-'+id+'" aria-label="Bijzonderheden" placeholder="Bijzonderheden, bijv. stoel stand 4" data-draft="'+id+'|note" value="'+esc(d.note)+'"><button class="btn'+(de?' ghost':'')+'" data-act="save:'+id+'">'+(de?'Bijwerken':'Opslaan')+'</button></div>';
  h+='<div style="margin-top:8px"><button class="link" data-act="hist:'+id+'">'+(S.hist[exId]?'Historie verbergen':'Historie')+'</button></div>';
  if(S.hist[exId]){
    const hs=entriesFor(exId).slice(0,10);

function chart(pts,met){
  if(pts.length<2)return '<p class="muted small">Na twee metingen verschijnt hier je lijn.</p>';
  const W=600,H=210,L=46,R=14,T=14,B=30;
  const xs=pts.map(p=>new Date(p.date+'T12:00:00').getTime());
  let x0=Math.min(...xs),x1=Math.max(...xs);if(x1===x0)x1=x0+864e5;
  let y0=Math.min(...pts.map(p=>p.v)),y1=Math.max(...pts.map(p=>p.v));
  const padY=(y1-y0)*0.15||1;y0-=padY;y1+=padY;
  const X=t=>L+(t-x0)/(x1-x0)*(W-L-R),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const line=pts.map((p,i)=>X(xs[i]).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ');
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(met.l)+' over tijd">';
  [y0+padY,(y0+y1)/2,y1-padY].forEach(v=>{const y=Y(v).toFixed(1);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-8)+'" y="'+y+'" dy="4" text-anchor="end" font-size="12" fill="var(--muted)" font-family="Barlow,sans-serif">'+fmtN(v)+'</text>'});
  s+='<polyline points="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach((p,i)=>{s+='<circle cx="'+X(xs[i]).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"><title>'+fmtDate(p.date)+': '+fmtN(p.v)+'</title></circle>'});
  s+='<text x="'+L+'" y="'+(H-8)+'" font-size="12" fill="var(--muted)" font-family="Barlow,sans-serif">'+fmtDate(pts[0].date)+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" font-size="12" fill="var(--muted)" font-family="Barlow,sans-serif">'+fmtDate(pts[pts.length-1].date)+'</text>';
  return s+'</svg>';
}

async function shareOrDownload(name,text,type){
  const blob=new Blob([text],{type});

    const file=new File([blob],name,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return true}
  }catch(e){if(e&&e.name==='AbortError')return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true;
}

/* ---------- Tanita-bon lezen (tekstherkenning draait op het toestel) ---------- */
const OCR_LABELS={weight:'gewicht',fat:'vetpercentage',fatMass:'vetmassa',ffm:'vetvrije massa',muscle:'spiermassa',waterPct:'lichaamsvocht %',bone:'botmassa',visceral:'visceraal vet',metaAge:'metabole leeftijd',bmr:'BMR'};
function parseTanita(raw){
  const MON={JAN:1,FEB:2,MAR:3,MRT:3,APR:4,MAY:5,MEI:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,OKT:10,NOV:11,DEC:12};
  const lines=raw.toUpperCase().split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const out={};
  const lab=s=>s.replace(/[^A-Z0-9%]/g,'').replace(/1/g,'I').replace(/0/g,'O');
  const numOf=s=>{const m=s.match(/(\d{1,3})\s*[.,]\s*(\d)(?!\d)/);if(m)return Number(m[1]+'.'+m[2]);const n=s.match(/(?:^|[^\d])(\d{1,3})(?![\d.,])/);return n?Number(n[1]):null};
  const inR=(v,a,b)=>v!=null&&v>=a&&v<=b?v:null;
  for(const l of lines){const m=l.replace(/\s/g,'').match(/(\d{1,2})\/([A-Z]{3})\/(\d{4})/);if(m&&MON[m[2]]){out.date=m[3]+'-'+String(MON[m[2]]).padStart(2,'0')+'-'+m[1].padStart(2,'0');break}}
  for(const l of lines){if(lab(l).includes('LENGTE')){out.height=inR(numOf(l),120,230);break}}
  let start=lines.findIndex(l=>{const L=lab(l);return L.includes('GEWICHT')&&!L.includes('KLED')&&!L.includes('KLEO')});
  if(start<0)start=0;
  let end=lines.findIndex((l,i)=>i>start&&/IDEA|WAARDEN/.test(lab(l)));if(end<0)end=lines.length;
  const R=lines.slice(start,end);let afterVisc=false;
  for(let i=0;i<R.length;i++){
    const l=R[i],L=lab(l),v=numOf(l.replace(/^[^A-Z]*[A-Z %]+/,''));
    if(L.includes('GEWICHT'))out.weight=inR(v,30,300);
    else if(L.includes('PERCENT'))out.fat=inR(v,2,70);
    else if(L.includes('VRIJE'))out.ffm=inR(v,20,200);
    else if(L.includes('VETMAS'))out.fatMass=inR(v,1,150);
    else if(L.includes('PIERMAS'))out.muscle=inR(v,15,180);
    else if(L.includes('VOCHT')&&L.includes('%'))out.waterPct=inR(v,30,80);
    else if(L.includes('BOTMAS'))out.bone=inR(v,1,10);
    else if(/KCA/.test(L)){const m=l.replace(/\s/g,'').match(/(\d{3,5})KCA/i);if(m)out.bmr=inR(Number(m[1]),800,5000)}
    else if(L.includes('METABOL')){let x=v;if(x==null&&R[i+1])x=numOf(R[i+1]);out.metaAge=inR(x,12,99)}
    else if(L.includes('VISCER')){out.visceral=inR(v,1,59);afterVisc=true}
  }
  return out;
}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function prepImage(file){
  const bmp=await createImageBitmap(file);
  const long=Math.max(bmp.width,bmp.height);const sc=Math.min(2,2200/long);
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
  const g=c.getContext('2d');g.drawImage(bmp,0,0,c.width,c.height);
  const img=g.getImageData(0,0,c.width,c.height),d=img.data,hist=new Array(256).fill(0);
  for(let i=0;i<d.length;i+=4){const y=Math.round(.299*d[i]+.587*d[i+1]+.114*d[i+2]);d[i]=y;hist[y]++}
  const n=d.length/4;let acc=0,lo=0,hi=255;
  for(let i=0;i<256;i++){acc+=hist[i];if(acc>n*.02){lo=i;break}}
  acc=0;for(let i=255;i>=0;i--){acc+=hist[i];if(acc>n*.02){hi=i;break}}
  const k=255/Math.max(1,hi-lo);
  for(let i=0;i<d.length;i+=4){const y=Math.max(0,Math.min(255,(d[i]-lo)*k));d[i]=d[i+1]=d[i+2]=y}
  g.putImageData(img,0,0);return c;
}
async function readReceipt(file){
  S.ocrBusy='Bon lezen…';S.ocrNote='';render();
  try{
    if(!window.Tesseract){S.ocrBusy='Tekstherkenning laden…';render();await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js')}
    const canvas=await prepImage(file);
    const worker=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text'){const p=Math.round(m.progress*100);if(S.ocrBusy!=='Bon lezen… '+p+'%'){S.ocrBusy='Bon lezen… '+p+'%';render()}}}});
    await worker.setParameters({tessedit_pageseg_mode:'6'});
    const {data:{text}}=await worker.recognize(canvas);
    await worker.terminate();
    const r=parseTanita(text);
    const found=Object.keys(OCR_LABELS).filter(k=>r[k]!=null);
    if(!found.length){S.ocrNote='Op deze foto kon ik geen waarden lezen. Probeer een scherpe foto, recht van boven, zonder schaduw.';return}
    const md={date:r.date||today()};
    found.forEach(k=>{md[k]=String(r[k]).replace('.',',')});
    if(S.mDraft.waist)md.waist=S.mDraft.waist;
    S.mDraft=md;
    if(r.height&&!num(D.height)){D.height=r.height;save()}
    const miss=Object.keys(OCR_LABELS).filter(k=>r[k]==null).map(k=>OCR_LABELS[k]);
    S.ocrNote=found.length+' waarden van de bon gelezen. Controleer ze voor je opslaat.'+(miss.length?' Niet gelezen, vul zelf in: '+miss.join(', ')+'.':'');
  }catch(e){
    S.ocrNote='De bon lezen lukte niet. Voor de eerste keer is internet nodig om de tekstherkenning te laden.';
  }finally{S.ocrBusy=null;render()}
}


/* ---------- Strava (via Supabase Edge Function; het Strava-geheim staat alleen op de server) ---------- */
const FN='https://qdgzqxnxiqddyxmphjci.supabase.co/functions/v1/strava';
const SKEY='gymlog-strava';
let ST=(function(){try{return JSON.parse(localStorage.getItem(SKEY))||{}}catch(e){return {}}})();
function saveSt(){try{localStorage.setItem(SKEY,JSON.stringify(ST))}catch(e){}}
function redirectUri(){return location.origin+location.pathname}
function stConnected(){return !!ST.refreshToken}
const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);

function stErr(e){
  if(e&&e.local)return e.local;
  if(e&&(e.status===401||e.status===400))return 'Strava weigert de toegang. Koppel opnieuw bij Instellingen.';
  if(e&&e.status===403)return 'Strava weigert dit. Staat de athlete capacity van je Strava-app op 10?';
  if(e&&e.status===429)return 'Strava: even te veel verzoeken. Probeer het over een kwartier opnieuw.';
  if(e&&e.status===500)return 'De Strava-koppeling is nog niet ingesteld (Client ID en Secret in Supabase).';
  if(e&&e.status)return 'Strava gaf een foutmelding ('+e.status+').';
  return 'Strava is niet bereikbaar. Heb je internet?';
}
async function fn(action,payload){
  const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({action},payload||{}))});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw {status:r.status};
  if(j.refresh_token){ST.refreshToken=j.refresh_token;saveSt()}
  return j;
}

async function stExchange(code){
  S.stBusy=true;S.stCode=null;render();
  try{const j=await fn('exchange',{code});ST.athlete=j.athlete||'';saveSt();S.stNote='';toast('Strava gekoppeld')}
  catch(e){S.stNote=stErr(e)}
  S.stBusy=false;render();
}
async function stDisconnect(){
  const rt=ST.refreshToken;
  delete ST.refreshToken;delete ST.athlete;saveSt();render();
  try{await fn('deauthorize',{refresh_token:rt})}catch(e){}
  toast('Strava ontkoppeld');
}
function stravaSettings(){
  let h='<h2>Strava</h2>';
  if(S.stCode){
    return h+'<div class="panel"><h3>Bijna klaar</h3><p class="small">Gebruik je Gymlog via het icoon op je beginscherm? Kopieer dan deze code, open Gymlog via het icoon en plak hem bij Instellingen → Strava → “Code plakken”.</p><input readonly id="st-code-show" value="'+esc(S.stCode)+'"><div class="btnrow"><button class="btn" data-act="stCopy">Code kopiëren</button><button class="btn ghost" data-act="stHere">Nee, koppel hier</button></div></div>';
  }
  if(stConnected()){
    return h+'<div class="panel"><p>✓ Gekoppeld'+(ST.athlete?' als <b>'+esc(ST.athlete)+'</b>':'')+'.</p><p class="small muted">Onder Workout staat per dag een knop om de workout naar Strava te sturen.</p><div class="btnrow"><button class="btn ghost sm" data-act="stDisconnect">Ontkoppelen</button></div></div>';
  }
  h+='<div class="panel"><p class="small">Koppel je eigen Strava-account. Gymlog krijgt alleen toestemming om activiteiten aan te maken.</p>'
    +'<div class="btnrow"><button class="btn" data-act="stConnect"'+(S.stBusy?' disabled':'')+'>'+(S.stBusy?'Bezig…':'Koppel met Strava')+'</button><button class="btn ghost" data-act="stCopyLink">Link voor Safari kopiëren</button></div>'
    +(S.stLink?'<input readonly style="margin-top:8px" value="'+esc(S.stLink)+'">':'')
    +(S.stNote?'<p class="small" style="color:var(--danger);margin-top:8px">'+esc(S.stNote)+'</p>':'')
    +'<p class="small muted" style="margin-top:8px">Lukt inloggen niet? Kopieer de link, open hem in Safari, log daar in (eventueel met de code die Strava je mailt) en plak de code die je terugkrijgt hieronder.</p>'
    +'<details style="margin-top:10px"><summary class="small">Code plakken</summary><div style="display:flex;gap:8px;margin-top:8px"><input id="st-paste" placeholder="Plak hier de code"><button class="btn ghost" data-act="stPaste">Gebruiken</button></div></details>'
    +'</div>';
  return h;
}
function stDefaults(){
  const es=D.entries.filter(e=>e.date===S.wDate).sort((a,b)=>a.ts-b.ts);
  const r=D.routines.find(x=>x.id===S.routineId);
  let start='18:00';
  if(S.wDate===today()&&es.length){const t=new Date(es[0].ts-5*60000);start=pad(t.getHours())+':'+pad(t.getMinutes())}
  return {name:'Krachttraining'+(r?' – '+r.name:''),start,dur:'60'};
}
function stDraft(){return Object.assign(stDefaults(),S.stDraft[S.wDate]||{})}
function stDescription(){
  const es=D.entries.filter(e=>e.date===S.wDate).sort((a,b)=>a.ts-b.ts);
  return es.map(e=>{const ex=exById(e.exerciseId);return (ex?ex.name:'Oefening')+': '+fmtN(e.weight)+' kg'+(e.sets||e.reps?', '+(e.sets||'?')+'×'+(e.reps||'?'):'')+(e.note?' ('+e.note+')':'')}).join('\n')+'\n\nGelogd met Gymlog';
}
function stravaPanel(){
  const n=D.entries.filter(e=>e.date===S.wDate).length;if(!n)return '';
  if(!stConnected())return '<p class="muted small" style="margin-top:18px">Deze workout naar Strava sturen? Koppel Strava bij <button class="link" data-act="tab:backup">Instellingen</button>.</p>';
  const sent=(D.stravaSent||{})[S.wDate];const d=stDraft();
  let h='<div class="panel" style="margin-top:18px"><h3>Naar Strava</h3>';
  if(sent)h+='<p class="small">✓ Staat op Strava. <a href="https://www.strava.com/activities/'+esc(sent)+'" target="_blank" rel="noopener">Bekijken</a></p>';
  h+='<label class="f" style="margin-top:8px">Titel<input id="st-name" data-st="name" value="'+esc(d.name)+'"></label>';
  if(!sent)h+='<div class="grid2" style="margin-top:8px"><label class="f">Starttijd<input type="time" id="st-start" data-st="start" value="'+esc(d.start)+'"></label><label class="f">Duur (min)<input id="st-dur" inputmode="numeric" data-st="dur" value="'+esc(d.dur)+'"></label></div>';
  h+='<p class="small muted" style="margin-top:8px">'+n+' oefening'+(n===1?'':'en')+' gaan mee in de beschrijving.'+(sent?' Bij bijwerken veranderen titel en beschrijving, tijd en duur niet.':'')+'</p>';
  h+='<div class="btnrow"><button class="btn" data-act="stSend"'+(S.stBusy?' disabled':'')+'>'+(S.stBusy?'Bezig…':(sent?'Strava bijwerken':'Naar Strava'))+'</button></div></div>';
  return h;
}
async function stSend(){
  const d=stDraft();const date=S.wDate;const sent=(D.stravaSent||{})[date];
  const name=(d.name||'Krachttraining').trim().slice(0,100);const description=stDescription();
  S.stBusy=true;render();
  try{
    if(sent){
      try{await fn('update',{refresh_token:ST.refreshToken,id:sent,name,description});toast('Strava bijgewerkt')}
      catch(e){if(e.status===404){delete D.stravaSent[date];save();toast('Activiteit niet meer gevonden op Strava. Stuur hem opnieuw.')}else throw e}
    }else{
      const dur=int(d.dur);if(!dur||dur<1)throw {local:'Vul een duur in minuten in.'};
      if(!/^\d{2}:\d{2}$/.test(d.start||''))throw {local:'Vul een starttijd in.'};
      const j=await fn('create',{refresh_token:ST.refreshToken,activity:{name,start_date_local:date+'T'+d.start+':00',elapsed_time:dur*60,description}});
      D.stravaSent=D.stravaSent||{};D.stravaSent[date]=String(j.id);save();toast('Op Strava gezet');
    }
  }catch(e){toast(stErr(e))}
  S.stBusy=false;render();
}
(function handleStravaReturn(){
  const q=new URLSearchParams(location.search);const code=q.get('code'),err=q.get('error');
  if(!code&&!err)return;
  history.replaceState(null,'',location.pathname);S.tab='backup';
  if(err){S.stNote='Koppelen geannuleerd.';return}
  if(!(q.get('scope')||'').includes('activity:write')){S.stNote='Geef bij het koppelen toestemming om activiteiten aan te maken.';return}
  // In Safari op iPhone (niet de beginscherm-app): eerst vragen waar je Gymlog gebruikt.
  if(isIOS&&!isStandalone)S.stCode=code;else stExchange(code);
})();

/* ---------- acties ---------- */
function saveSet(exId){
  const d=draftFor(exId);const w=num(d.weight);
  if(w==null)return toast('Vul een gewicht in (0 mag ook).');
  const vals={weight:w,sets:int(d.sets),reps:int(d.reps),note:String(d.note||'').trim().slice(0,200)};
  const de=dayEntry(exId,S.wDate);
  if(de)Object.assign(de,vals);
  else D.entries.push(Object.assign({id:rid(),ts:Date.now(),date:S.wDate,exerciseId:exId},vals));
  save();delete S.drafts[exId];if(storageOk)toast(de?'Bijgewerkt':'Opgeslagen');render();
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  const [act,...a]=b.dataset.act.split(':');
  if(act!=='delRoutine')S.confirmDel=null;
  if(act!=='wipe')S.confirmWipe=false;
  if(act!=='delMeas')S.confirmMeas=null;
  if(act==='tab'){S.tab=a[0];render();window.scrollTo(0,0)}
  else if(act==='routine'){S.routineId=a[0];render()}
  else if(act==='wToday'){S.wDate=today();S.drafts={};render()}
  else if(act==='gotoDate'){S.wDate=a[0];S.drafts={};S.hist={};render();window.scrollTo(0,0)}
  else if(act==='step'){const d=Object.assign({},draftFor(a[0]));const w=(num(d.weight)||0)+Number(a[1]);d.weight=String(Math.max(0,Math.round(w*100)/100)).replace('.',',');S.drafts[a[0]]=d;render()}
  else if(act==='save')saveSet(a[0]);
  else if(act==='hist'){S.hist[a[0]]=!S.hist[a[0]];render()}
  else if(act==='delEntry'){const e=D.entries.find(x=>x.id===a[0]);D.entries=D.entries.filter(x=>x.id!==a[0]);if(e)delete S.drafts[e.exerciseId];save();toast('Verwijderd');render()}
  else if(act==='newRoutine'){const n=$('#nr-name').value.trim();if(!n)return toast('Geef het schema een naam.');const r={id:rid(),name:n.slice(0,40),exercises:[]};D.routines.push(r);S.routineId=r.id;save();render()}
  else if(act==='delRoutine'){if(S.confirmDel!==a[0]){S.confirmDel=a[0];return render()}S.confirmDel=null;D.routines=D.routines.filter(r=>r.id!==a[0]);save();render()}
  else if(act==='mv'){const r=D.routines.find(x=>x.id===a[0]);const i=+a[1],j=i+(+a[2]);if(!r||j<0||j>=r.exercises.length)return;[r.exercises[i],r.exercises[j]]=[r.exercises[j],r.exercises[i]];save();render()}
  else if(act==='rm'){const r=D.routines.find(x=>x.id===a[0]);if(!r)return;r.exercises.splice(+a[1],1);save();render()}
  else if(act==='addEx'){
    const n=S.newEx.name.trim();if(!n)return toast('Vul een naam in.');
    if(D.exercises.some(e=>e.name.toLowerCase()===n.toLowerCase()))return toast('Die oefening staat er al.');
    D.exercises.push({id:rid(),name:n.slice(0,50),group:S.newEx.group});S.newEx={name:'',group:S.newEx.group};save();toast('Oefening toegevoegd');render();
  }
  else if(act==='metric'){S.metric=a[0];render()}
  else if(act==='saveMeas'){
    const md=S.mDraft;const o={id:rid(),date:md.date||today(),ts:Date.now()};let any=false;
    METRICS.filter(x=>!x.computed).forEach(x=>{const v=num(md[x.k]);o[x.k]=v;if(v!=null)any=true});
    if(!any)return toast('Vul minstens één waarde in.');
    D.meas.push(o);save();S.mDraft={date:today()};S.ocrNote='';toast('Meting opgeslagen');render();
  }
  else if(act==='delMeas'){if(S.confirmMeas!==a[0]){S.confirmMeas=a[0];return render()}S.confirmMeas=null;D.meas=D.meas.filter(m=>m.id!==a[0]);save();toast('Meting verwijderd');render()}
  else if(act==='exportJson')exportJson();
  else if(act==='stConnect')stConnect();
  else if(act==='stCopyLink')stCopyLink();
  else if(act==='stDisconnect')stDisconnect();
  else if(act==='stSend')stSend();
  else if(act==='stPaste'){const c=$('#st-paste').value.trim();if(!c)return toast('Plak eerst de code.');stExchange(c)}
  else if(act==='stHere'){const c=S.stCode;S.stCode=null;stExchange(c)}
  else if(act==='stCopy'){const c=S.stCode||'';(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>toast('Code gekopieerd')).catch(()=>{const i=$('#st-code-show');i.select();toast('Selecteer en kopieer de code')})}
  else if(act==='exportCsv')exportCsv();
  else if(act==='photoPick'){$('#photoFile').value='';$('#photoFile').click()}
  else if(act==='importPick'){$('#importFile').value='';$('#importFile').click()}
  else if(act==='importCancel'){S.pendingImport=null;render()}
  else if(act==='importConfirm'){D=Object.assign(fresh(),S.pendingImport);S.pendingImport=null;S.drafts={};S.hist={};save();toast('Back-up teruggezet');render()}
  else if(act==='wipe'){if(!S.confirmWipe){S.confirmWipe=true;return render()}S.confirmWipe=false;D=fresh();S.drafts={};S.hist={};save();toast('Alles gewist');render()}
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.draft){const [id,f]=t.dataset.draft.split('|');const d=Object.assign({},draftFor(id));d[f]=t.value;S.drafts[id]=d}
  else if(t.dataset.m){S.mDraft[t.dataset.m]=t.value}
  else if(t.dataset.st){S.stDraft[S.wDate]=Object.assign({},S.stDraft[S.wDate]||{},{[t.dataset.st]:t.value})}
  else if(t.dataset.newex==='name'){S.newEx.name=t.value}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='photoFile'){const f=t.files&&t.files[0];if(f)readReceipt(f);return}
  if(t.id==='importFile'){
    const f=t.files&&t.files[0];if(!f)return;
    f.text().then(txt=>{const d=JSON.parse(txt);if(!validImport(d))throw new Error('x');S.pendingImport=d;render()}).catch(()=>toast('Dit is geen geldig Gymlog-back-upbestand.'));
  }
  else if(t.dataset.addto&&t.value){const r=D.routines.find(x=>x.id===t.dataset.addto);if(r&&!r.exercises.includes(t.value)){r.exercises.push(t.value);save();render()}else{t.value='';toast('Staat al in dit schema.')}}
  else if(t.dataset.rname){const n=t.value.trim();const r=D.routines.find(x=>x.id===t.dataset.rname);if(!n||!r)return render();r.name=n.slice(0,40);save();render()}
  else if(t.dataset.newex==='group'){S.newEx.group=t.value}
  else if(t.dataset.wdate){const v=t.value;if(!v||v>today()){t.value=S.wDate;return toast('Kies een datum tot en met vandaag.')}S.wDate=v;S.drafts={};render()}
  else if(t.dataset.height){D.height=num(t.value);save();toast('Lengte opgeslagen');render()}
});

render();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
