# Houdt het gratis Supabase-project actief (gratis projecten pauzeren na 7 dagen zonder activiteit).
# Schrijft twee keer per week een tijdstempel in de database via de functie public.keepalive().
# Plaats dit bestand in je repository als: .github/workflows/supabase-keepalive.yml
name: Supabase keepalive

on:
  schedule:
    - cron: "17 6 * * 1"   # maandag 06:17 UTC
    - cron: "17 6 * * 4"   # donderdag 06:17 UTC
  workflow_dispatch:        # handmatig starten via het tabblad Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Schrijf tijdstempel in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $status"; cat response.txt; echo
          test "$status" -ge 200 -a "$status" -lt 300
